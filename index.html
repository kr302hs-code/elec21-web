<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>전기기사 필기 21일</title>
<style>
:root{
  --bg:#FBF8EE; --side:#FCFAF3; --card:#FFFFFF; --line:#EFEADB; --line2:#E6E0CD;
  --yellow:#F6D45C; --yellow-soft:#FDF2CC; --yellow-pale:#FEF8E4;
  --ink:#1D1D1B; --sub:#8C8676; --mute:#B9B3A3;
  --green:#3BB86A; --green-soft:#E6F5EA; --red:#E4553F; --red-soft:#FCECE8; --orange:#EE8A3A;
  --gray-chip:#F3F0E6; --black:#1D1D1B;
  color-scheme: light;
  --fsk: 1;
  --fs0: clamp(.8px, calc(.045vw + .3px), .95px);
  --fs: calc(var(--fs0) * var(--fsk));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:calc(var(--fs) * 16);line-height:1.5;word-break:keep-all;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.side{width:250px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.logo{height:96px;background:var(--yellow);display:flex;align-items:center;gap:10px;padding:0 28px;font-weight:700;font-size:calc(var(--fs) * 23);letter-spacing:-.5px}
.logo svg{fill:var(--ink);stroke:none;width:26px;height:26px}
.nav{padding:20px 16px;display:flex;flex-direction:column;gap:6px}
.nav a{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;color:#4a463d;text-decoration:none;font-size:calc(var(--fs) * 18)}
.nav a.on{background:var(--yellow-soft);color:var(--ink);font-weight:700}
.nav a svg{color:#6f6a5c}
.main{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{padding:44px 48px 60px;max-width:1500px}
.hello{color:#6f6a5c;font-size:calc(var(--fs) * 19);margin:0 0 4px}
.h1{font-size:calc(var(--fs) * 38);font-weight:700;letter-spacing:-1px;margin:0 0 18px;line-height:1.25}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:9px 18px;font-weight:700;font-size:calc(var(--fs) * 15)}
.chip span{color:var(--sub);font-weight:400}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;margin-top:28px;align-items:start}
.col{display:flex;flex-direction:column;gap:24px}
.card{background:var(--card);border-radius:28px;padding:30px 32px;border:1px solid #F3EFE2}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.995)}
.eyebrow{color:var(--sub);font-size:calc(var(--fs) * 15);margin:0 0 6px}
.ctitle{font-size:calc(var(--fs) * 26);font-weight:700;letter-spacing:-.6px;margin:0 0 18px}
.cdesc{color:#6f6a5c;margin:0;font-size:calc(var(--fs) * 16)}
.btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 26px;border-radius:999px;font-weight:700;font-size:calc(var(--fs) * 17)}
.btn.y{background:var(--yellow)}
.btn.k{background:var(--black);color:#fff}
.btn.o{background:#fff;border:1px solid var(--line2)}
.btn.g{background:var(--gray-chip)}
.btn.sm{height:42px;padding:0 18px;font-size:calc(var(--fs) * 15)}
.plan{display:flex;align-items:center;justify-content:space-between;gap:20px}
.bolt{width:130px;height:130px;border-radius:50%;background:var(--yellow-pale);display:grid;place-items:center;flex:none}
.bolt svg{width:68px;height:68px;fill:var(--yellow);stroke:none}
.resume{background:linear-gradient(100deg,var(--yellow-pale),#fff 60%);position:relative}
.tagy{display:inline-block;background:var(--yellow-soft);border-radius:999px;padding:5px 14px;font-size:calc(var(--fs) * 15);font-weight:500}
.resume .cnt{position:absolute;right:32px;top:30px;color:var(--sub);font-weight:700}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.mini{padding:24px 24px}.mini .ctitle{font-size:calc(var(--fs) * 20);margin-bottom:6px}
.mini .n{font-size:calc(var(--fs) * 15);color:var(--sub)}
.week{display:flex;justify-content:space-between;margin-top:22px}
.week div{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--sub);font-size:calc(var(--fs) * 15)}
.dot{width:46px;height:46px;border-radius:50%;background:#F4F1E8;display:grid;place-items:center}
.dot.on{background:var(--yellow)}
.dot.on svg{fill:var(--ink);stroke:none;width:20px;height:20px}
.today{color:var(--ink)!important;font-weight:700}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.stat3 div{background:var(--bg);border-radius:18px;padding:14px 16px}
.stat3 b{display:block;font-size:calc(var(--fs) * 26);letter-spacing:-.5px}
.stat3 small{color:var(--sub);font-size:calc(var(--fs) * 14)}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:24px}
.day{background:#fff;border-radius:24px;padding:22px 24px;border:1px solid #F3EFE2;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.day .top{display:flex;justify-content:space-between;align-items:center}
.day .dn{font-weight:700;font-size:calc(var(--fs) * 20)}
.day .sj{font-size:calc(var(--fs) * 13);color:var(--sub);background:var(--gray-chip);border-radius:999px;padding:3px 10px}
.day .tt{color:#4a463d;font-size:calc(var(--fs) * 15);min-height:45px;line-height:1.5}
.bar{height:8px;background:#F1EDE1;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:99px}
.day .meta{display:flex;gap:12px;font-size:calc(var(--fs) * 14);color:var(--sub)}
.day .meta b{font-weight:700}
.gr{color:var(--green)}.rd{color:var(--red)}.or{color:var(--orange)}
.subjhead{font-weight:700;font-size:calc(var(--fs) * 19);margin:30px 0 -8px;color:#4a463d}

.qwrap{display:flex;flex-direction:column;height:100%;width:100%}
.qtop{height:96px;flex:none;display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--line)}
.qtop .lg{width:250px;height:100%;background:var(--yellow);display:flex;align-items:center;gap:14px;padding:0 24px;font-weight:700;font-size:calc(var(--fs) * 21);flex:none}
.qtop .lg svg.b{fill:var(--ink);stroke:none}
.qtop .tt{font-weight:700;font-size:calc(var(--fs) * 20);padding:0 24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.prog{display:flex;align-items:center;gap:16px;font-size:calc(var(--fs) * 18);color:var(--sub);flex:none}
.prog b{color:var(--ink)}
.prog .bar{width:150px;height:10px}
.prog .pc{font-weight:700;color:#6f6a5c;width:56px}
.qbtns{display:flex;align-items:center;gap:10px;padding:0 22px;flex:none}
.res{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;font-weight:700}
.res.O{background:var(--green-soft);color:var(--green)}
.res.X{background:var(--red-soft);color:var(--red)}
.res.T{background:var(--yellow-soft);color:#9a7a10}
.qbody{flex:1;min-height:0;display:flex;gap:22px;padding:22px}
.qleft{flex:0 0 38%;background:#fff;border-radius:28px;overflow-y:auto;padding:30px 34px 40px;-webkit-overflow-scrolling:touch}
.qright{flex:1;min-width:0;background:#fff;border-radius:28px;display:flex;flex-direction:column;overflow:hidden}
.qhead{display:flex;align-items:center;gap:14px}
.grade{height:46px;min-width:46px;padding:0 12px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;font-weight:700;font-size:calc(var(--fs) * 17)}
.qno{font-size:calc(var(--fs) * 46);font-weight:700;letter-spacing:-1px;line-height:1}
.qtools{margin-left:auto;display:flex;gap:18px;color:#5b574c;font-weight:500}
.qtools button{display:flex;align-items:center;gap:6px;font-size:calc(var(--fs) * 17)}
.qtools .on{color:#c99a00}
.qtools .on svg{fill:var(--yellow)}
.tags{margin:16px 0 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{background:var(--gray-chip);border-radius:999px;padding:6px 14px;font-size:calc(var(--fs) * 15)}
.tag b{font-weight:700}
.tag span{color:var(--sub)}
.tlink{color:var(--sub);font-size:calc(var(--fs) * 15);text-decoration:underline;text-underline-offset:3px}
.qimg img,.eimg img,.cimgs img{display:block;width:100%;height:auto}
.choices{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.ch{display:flex;align-items:center;gap:16px;height:66px;border:1.5px solid var(--line);border-radius:18px;padding:0 20px;font-size:calc(var(--fs) * 19);text-align:left;background:#fff}
.ch .k{width:38px;height:38px;border-radius:9px;background:var(--gray-chip);display:grid;place-items:center;font-weight:700;font-size:calc(var(--fs) * 17)}
.ch.ok{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
.ch.ok .k{background:var(--green);color:#fff}
.ch.bad{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:700}
.ch.bad .k{background:var(--red);color:#fff}
.ch.ans{border-color:#CFCAB9;background:#F2F0EA;color:#5b574c;font-weight:700}
.ch.ans .k{background:#9A9586;color:#fff}
.ch:disabled{cursor:default}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;height:76px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:calc(var(--fs) * 19);color:#6f6a5c;border-bottom:3px solid transparent}
.tabs button.on{background:var(--yellow-pale);color:var(--ink);font-weight:700;border-bottom-color:var(--yellow)}
.tabpane{flex:1;min-height:0;position:relative;display:none}
.tabpane.on{display:flex;flex-direction:column}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.ptitle{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--line);font-weight:700;font-size:calc(var(--fs) * 19)}
.lock{display:flex;flex-direction:column;align-items:center;gap:22px;padding:120px 20px;color:var(--sub);font-size:calc(var(--fs) * 18)}
.tl{padding:24px 28px 50px}
.step{display:flex;gap:16px}
.step .rail{display:flex;flex-direction:column;align-items:center}
.step .ring{width:22px;height:22px;border-radius:50%;border:5px solid var(--green);background:#fff;margin-top:4px}
.step .ring.y{border-color:var(--yellow)}
.step .ln{flex:1;width:2px;background:var(--line);margin:4px 0}
.step .bd{flex:1;min-width:0;padding-bottom:26px}
.step h4{margin:0 0 14px;font-size:calc(var(--fs) * 18)}
.box{border:1px solid var(--line);border-radius:22px;padding:22px 26px}
.score{display:flex;align-items:center;gap:16px;font-size:calc(var(--fs) * 17);color:#6f6a5c}
.score i{font-style:normal;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--fs) * 20);background:var(--green)}
.score i.r{background:var(--red)} .score i.t{background:#B5AE9C}
.score .sep{width:1px;height:36px;background:var(--line);margin:0 10px}
.clink{display:flex;align-items:center;gap:12px;margin-top:18px;width:100%;padding:16px 20px;border-radius:18px;background:var(--yellow-pale);font-weight:700;font-size:calc(var(--fs) * 17);text-align:left}
.clink small{display:block;font-weight:400;color:var(--sub);font-size:calc(var(--fs) * 14)}
.clink svg:last-child{margin-left:auto}

.tb{display:flex;align-items:center;gap:3px;margin:12px;padding:6px;border:1px solid var(--line);border-radius:20px;background:#fff;flex:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tb .t{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:54px;height:62px;padding:0 4px;border-radius:14px;font-size:calc(var(--fs) * 12);color:#4a463d;border:1px solid transparent}
.tb .t.on{background:var(--yellow-soft);border-color:#F3DD8C}
.tb .t:disabled{opacity:.35}
.tb .sz{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:2px}
.tb .sz button{width:38px;height:50px;border-radius:11px;display:grid;place-items:center}
.tb .sz button.on{background:#fff;box-shadow:0 1px 3px rgba(60,50,20,.12)}
.tb .sz i{display:block;border-radius:50%;background:var(--ink)}
.tb .div{width:1px;height:40px;background:var(--line);margin:0 2px}
.tb .sp{flex:1}
.tb .danger{color:var(--red)}
.tb .save{min-width:78px}
.tb .save .sw{width:42px;height:24px;border-radius:99px;background:#DCD7C8;position:relative;transition:background .15s;margin-bottom:4px}
.tb .save .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tb .save.on{background:var(--green-soft);border-color:#BFE6CB;color:var(--green);font-weight:700}
.tb .save.on .sw{background:var(--green)}
.tb .save.on .sw::after{left:21px}
.cv{flex:1;min-height:0;position:relative;border-top:1px solid var(--line)}
.cv.grid{background-image:linear-gradient(#F1EEE6 1px,transparent 1px),linear-gradient(90deg,#F1EEE6 1px,transparent 1px);background-size:44px 44px}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.penbadge{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#9A9586;color:#fff;display:grid;place-items:center;opacity:.85;pointer-events:none}
.penbadge.er{background:var(--red)}

.legend{display:flex;gap:16px;font-size:calc(var(--fs) * 18);font-weight:700}
.legend span::before{content:"●";margin-right:5px}
.sgrid{display:grid;grid-template-columns:repeat(8,1fr)}
.sgrid button{height:88px;display:grid;place-items:center;font-size:calc(var(--fs) * 21);border-right:1px solid #fff;border-bottom:1px solid #fff;position:relative;background:var(--red-soft);color:var(--orange)}
.sgrid button.O{background:var(--green-soft);color:var(--green)}
.sgrid button.O span{width:54px;height:54px;border:2.5px solid var(--green);border-radius:50%;display:grid;place-items:center}
.sgrid button.X{color:var(--red)}
.sgrid button.X::after{content:"";position:absolute;width:34px;height:34px;background:
 linear-gradient(45deg,transparent 46%,rgba(228,85,63,.75) 46%,rgba(228,85,63,.75) 54%,transparent 54%),
 linear-gradient(-45deg,transparent 46%,rgba(228,85,63,.75) 46%,rgba(228,85,63,.75) 54%,transparent 54%)}
.sgrid button.T{color:var(--red)}
.sgrid button.T::after{content:"";position:absolute;width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;border-bottom:46px solid rgba(228,85,63,.22)}
.sgrid button.cur{outline:3px solid var(--ink);outline-offset:-3px;z-index:1}
.secthead{display:flex;justify-content:space-between;padding:16px 28px;background:var(--bg);font-size:calc(var(--fs) * 16)}
.secthead b{font-size:calc(var(--fs) * 18)}
.secthead span{color:var(--sub)}

.modal{position:fixed;inset:0;background:rgba(40,36,24,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:30px}
.sheet{background:#fff;border-radius:30px;max-width:980px;width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet .hd{display:flex;align-items:center;gap:14px;padding:22px 28px;border-bottom:1px solid var(--line)}
.sheet .hd h3{margin:0;font-size:calc(var(--fs) * 22);flex:1}
.sheet .bd{overflow-y:auto;padding:24px 28px 34px;-webkit-overflow-scrolling:touch}
.x{width:46px;height:46px;border-radius:50%;background:var(--gray-chip);display:grid;place-items:center;flex:none}
.cimgs{display:flex;flex-direction:column;gap:6px}
.cnav{display:flex;align-items:center;gap:12px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#fff;flex:none}
.cnav .cpos{flex:1;text-align:center;color:var(--sub);font-size:calc(var(--fs) * 15)}
.cnav .cpos b{color:var(--ink)}
.cnav .btn:disabled{opacity:.35}
.cimgs.zoom{width:200%}
.sheet .bd:has(.cimgs){overflow-x:auto}
.big4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 24px}
.big4 div{background:var(--bg);border-radius:20px;padding:18px 20px}
.big4 b{font-size:calc(var(--fs) * 32);display:block}
.big4 small{color:var(--sub)}
.wlist{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 24px}
.wlist button{min-width:52px;height:44px;border-radius:12px;background:var(--red-soft);color:var(--red);font-weight:700;padding:0 10px}
.wlist button.T{background:var(--yellow-soft);color:#9a7a10}
.acts{display:flex;gap:10px;flex-wrap:wrap}.plan .acts{flex-wrap:nowrap}

.nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;margin-top:24px}
.ncard{background:#fff;border-radius:24px;border:1px solid #F3EFE2;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.ncard .pv{display:grid;grid-template-columns:1fr 1fr;height:190px;border-bottom:1px solid var(--line)}
.ncard .pv>div{overflow:hidden;position:relative}
.ncard .pv>div+div{border-left:1px solid var(--line)}
.ncard .pv img{width:100%;display:block}
.ncard .pv canvas{width:100%;height:100%;display:block;background:#FDFCF8}
.ncard .ft{padding:14px 18px;display:flex;align-items:center;gap:10px}
.ncard .ft b{font-size:calc(var(--fs) * 17)}
.ncard .ft span{color:var(--sub);font-size:calc(var(--fs) * 14);margin-left:auto;text-align:right}
.empty{background:#fff;border-radius:28px;padding:60px 30px;text-align:center;color:var(--sub);margin-top:24px;font-size:calc(var(--fs) * 17)}
.empty b{display:block;color:var(--ink);font-size:calc(var(--fs) * 21);margin-bottom:8px}
.ndetail{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.ndetail .ink{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#FDFCF8}
.ndetail canvas{display:block;width:100%}

.clist{display:grid;grid-template-columns:280px 1fr;gap:24px;margin-top:24px;align-items:start}
.dsel{background:#fff;border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:2px}
.dsel button{text-align:left;padding:12px 16px;border-radius:14px;font-size:calc(var(--fs) * 16);display:flex;gap:10px}
.dsel button span{color:var(--sub);font-size:calc(var(--fs) * 14);margin-left:auto}
.dsel button.on{background:var(--yellow-soft);font-weight:700}
.citems{display:flex;flex-direction:column;gap:12px}
.citem{background:#fff;border-radius:20px;padding:18px 22px;display:flex;align-items:center;gap:16px;cursor:pointer;border:1px solid #F3EFE2}
.citem .num{background:var(--yellow);border-radius:10px;padding:4px 10px;font-weight:700;font-size:calc(var(--fs) * 14);flex:none}
.citem .nm{font-weight:700;font-size:calc(var(--fs) * 18)}
.citem .qq{margin-left:auto;color:var(--sub);font-size:calc(var(--fs) * 14);flex:none}

.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 24px;border-radius:999px;font-size:calc(var(--fs) * 16);z-index:80;pointer-events:none}
.setrow{display:flex;align-items:center;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow div{flex:1}
.setrow b{display:block;font-size:calc(var(--fs) * 18)}
.setrow small{color:var(--sub);font-size:calc(var(--fs) * 15)}

@media (max-width: 1100px){
  .grid2{grid-template-columns:1fr}
  .qbody{flex-direction:column;overflow-y:auto}
  .qleft{flex:none;overflow:visible}
  .qright{flex:none;height:78vh}
  .prog .bar{width:120px}
  .qtop .lg{width:auto}
  .qtop .lg span{display:none}
  .row3{grid-template-columns:1fr}
}
.mob-only{display:none!important}
.tabs button.hide{display:none!important}
.ch.pick{border-color:#E9C23F;background:var(--yellow-pale);font-weight:700}
.ch.pick .k{background:var(--yellow)}
.timer{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:var(--gray-chip);font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{background:var(--red-soft);color:var(--red)}

const GRADE_CUT = { A: 0.5, B: 0.8 };
function computeGrades(){
  const cc = {}, order = {};
  D.concepts.forEach((c, i) => order[c.id] = i);
  D.questions.forEach(q => { if (q.conceptId) cc[q.conceptId] = (cc[q.conceptId] || 0) + 1; });
  const gmap = {};
  SUBJ6.forEach(sj => {
    const qs = D.questions.filter(q => q.subject === sj), tot = qs.length;
    const cons = [...new Set(qs.map(q => q.conceptId))].sort((a, b) => (cc[b] - cc[a]) || (order[a] - order[b]));
    let cum = 0; cons.forEach(c => { gmap[c] = cum < tot * GRADE_CUT.A ? "A" : cum < tot * GRADE_CUT.B ? "B" : "C"; cum += cc[c]; });
  });
  D.questions.forEach(q => { q.grade = q.dap ? "A" : (gmap[q.conceptId] || "C"); });
  D.concepts.forEach(c => { c.grade = gmap[c.id] || ""; });
}

/* pinch zoom for a scroll container whose content grows in width (one finger scrolls natively) */
function attachPinch(sc, content, max = 4){
  let p0 = null, scale = 1, lastTap = 0;
  const apply = (s, mx, my) => {
    s = Math.min(max, Math.max(1, s)); const r = scale;
    const cx = sc.scrollLeft + mx, cy = sc.scrollTop + my;
    content.style.width = (s * 100) + "%"; scale = s;
    sc.scrollLeft = cx * s / r - mx; sc.scrollTop = cy * s / r - my;
  };
  sc.addEventListener("touchstart", e => { if (e.touches.length === 2) p0 = { d: dist(e.touches[0], e.touches[1]), s: scale }; }, { passive:true });
  sc.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && p0){ e.preventDefault(); const r = sc.getBoundingClientRect(), m = midp(e.touches[0], e.touches[1]);
      apply(p0.s * dist(e.touches[0], e.touches[1]) / p0.d, m.x - r.left, m.y - r.top); }
  }, { passive:false });
  sc.addEventListener("touchend", e => { if (e.touches.length < 2) p0 = null; });
  sc.addEventListener("dblclick", e => { const r = sc.getBoundingClientRect(); apply(scale > 1.2 ? 1 : 2.2, e.clientX - r.left, e.clientY - r.top); });
  sc.addEventListener("touchend", e => { if (e.changedTouches.length !== 1 || e.touches.length) return; const now = Date.now();
    if (now - lastTap < 280){ const t = e.changedTouches[0], r = sc.getBoundingClientRect(); apply(scale > 1.2 ? 1 : 2.2, t.clientX - r.left, t.clientY - r.top); lastTap = 0; } else lastTap = now; });
  sc.addEventListener("wheel", e => { if (!e.ctrlKey) return; e.preventDefault(); const r = sc.getBoundingClientRect(); apply(scale * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX - r.left, e.clientY - r.top); }, { passive:false });
  return { reset(){ apply(1, 0, 0); } };
}

    const cx = sc.scrollLeft + mx, cy = sc.scrollTop + my; zin.style.width = (s2 * 100) + "%"; scale = s2;

  sc.addEventListener("pointerdown", e => { d0 = { x: e.clientX, y: e.clientY, t: Date.now(), sl: sc.scrollLeft, st: sc.scrollTop, mouse: e.pointerType === "mouse" }; });

function startClip(){

  ql.appendChild(ov); ov.style.top = ql.scrollTop + "px";
  let p0 = null; const rect = $(".cliprect", ov);
  const loc = e => { const r = ov.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  ov.addEventListener("pointerdown", e => { if (e.target.closest("[data-clipx]")) return; p0 = loc(e); ov.setPointerCapture(e.pointerId); e.preventDefault(); });
  ov.addEventListener("pointermove", e => { if (!p0) return; const p = loc(e);
    Object.assign(rect.style, { display:"block", left: Math.min(p.x, p0.x) + "px", top: Math.min(p.y, p0.y) + "px", width: Math.abs(p.x - p0.x) + "px", height: Math.abs(p.y - p0.y) + "px" }); });
  ov.addEventListener("pointerup", async e => { if (!p0) return; const p = loc(e), a = p0; p0 = null;
    const sel = { l: Math.min(a.x, p.x), t: Math.min(a.y, p.y), w: Math.abs(p.x - a.x), h: Math.abs(p.y - a.y) };
    if (sel.w < 20 || sel.h < 20){ rect.style.display = "none"; return; }
    const ob = ov.getBoundingClientRect(), cx = ob.left + sel.l + sel.w / 2, cy = ob.top + sel.t + sel.h / 2;
    const img = [...ql.querySelectorAll(".cimgs img")].find(im => { const r = im.getBoundingClientRect(); return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom; });
    if (!img){ toast("이론 이미지 위를 선택해 주세요"); rect.style.display = "none"; return; }
    const ir = img.getBoundingClientRect(), k = img.naturalWidth / ir.width;
    const sx = Math.max(0, (ob.left + sel.l - ir.left) * k), sy = Math.max(0, (ob.top + sel.t - ir.top) * k);
    const sw = Math.min(img.naturalWidth - sx, sel.w * k), sh = Math.min(img.naturalHeight - sy, sel.h * k);
    const cv = document.createElement("canvas"); cv.width = Math.round(sw); cv.height = Math.round(sh);
    cv.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);

  });

}

function drawThumb(cv, rec){

  if (x1 <= x0){ x0 = 0; y0 = 0; x1 = rec.w; y1 = rec.h; }
  const padd = 12, bw = box.offsetWidth, bh = box.offsetHeight, k = Math.min(bw / (x1 - x0 + padd * 2), bh / (y1 - y0 + padd * 2), 1);
  const dpr = window.devicePixelRatio || 1; cv.width = bw * dpr; cv.height = bh * dpr;
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * (padd - x0) * k, dpr * (padd - y0) * k);
  rec.strokes.forEach(s => drawStroke(ctx, s));
}

// reset points: anything older than S.resetAt (records) / S.resetAllAt (everything) is dropped on every device
const REC_KEYS = ["sessions","qstat","reviews","rounds","hist","srs","why","qtime","planDay","predHist"], ALL_KEYS = ["scrapMap","memos","creads","clipSrs","nb","tags","cdiff","csum","cq2","myq","mycards","reports","diary","realExams","nbColor"];
function clearRecords(){ REC_KEYS.forEach(k => S[k] = {}); S.mocks = []; S.attend = []; S.daySec = {}; S.dayQ = {}; S.retry = {}; S.subjSec = {}; S.hourStat = {}; S.placeStat = {}; S.dayFirst = {}; S.recent = []; S.cqStat = {}; S.ctime = {}; S.goalDays = []; S.last = null; S.lastTs = 0; S.weekShown = ""; }
function clearAll(){ clearRecords(); ALL_KEYS.forEach(k => S[k] = {}); S.scraps = []; S.notes = {}; S.migrNB = true; }
async function wipeLocalFiles(){ for (const st of [undefined, "clips", "pages"]) for (const k of await IDB.keys(st)) await IDB.del(k, st); S.blobTs = {}; }
async function doReset(all){
  const t = Date.now();
  if (all){ clearAll(); await wipeLocalFiles(); S.resetAllAt = t; } else clearRecords();
  S.resetAt = t; S.changedAt = t; persist(); toast(all ? "전체 초기화했어요" : "풀이 기록을 초기화했어요");
  if (Sync.linked()) await Sync.run(true, true);
  route();
}
function tsOf(k, v){ return k === "sessions" ? v.updated : k === "reviews" ? v.at : k === "hist" ? v.updated : v.ts; }
function mergeState(R){
  if (!R) return;
  // the other device reset later than us → apply its reset here first
  if ((R.resetAllAt || 0) > (S.resetAllAt || 0)){ clearAll(); S.resetAllAt = R.resetAllAt; S._wipe = true; }
  if ((R.resetAt || 0) > (S.resetAt || 0)){ clearRecords(); S.resetAt = R.resetAt; }
  const rA = S.resetAt || 0, rB = S.resetAllAt || 0;
  R = Object.assign({}, R);
  REC_KEYS.forEach(k => { const o = {}; for (const [id, v] of Object.entries(R[k] || {})) if ((tsOf(k, v) || 0) > rA) o[id] = v; R[k] = o; });
  ALL_KEYS.forEach(k => { const o = {}; for (const [id, v] of Object.entries(R[k] || {})) if ((v.ts || 0) > rB) o[id] = v; R[k] = o; });
  R.mocks = (R.mocks || []).filter(m => (m.updated || m.done || m.created || 0) > rA);
  if ((R.resetAt || 0) < rA){ R.attend = (R.attend || []).filter(d => d >= todayStr()); R.daySec = {}; R.dayQ = {}; }
  const by = (L, Rm, f) => { for (const [k, v] of Object.entries(Rm || {})) if (!L[k] || (f(v) || 0) > (f(L[k]) || 0)) L[k] = v; };
  by(S.qstat, R.qstat, v => v.ts);
  for (const [k, rv] of Object.entries(R.sessions || {})){
    const lv = S.sessions[k];
    if (!lv){ S.sessions[k] = rv; continue; }
    if (lv.hid && rv.hid && lv.hid !== rv.hid && !k.startsWith("day:") && !k.includes(":")){
      // two devices each ran their own set under the same key → keep both
      const [keep, other] = (rv.updated || 0) > (lv.updated || 0) ? [rv, lv] : [lv, rv];
      S.sessions[k] = keep;
      if (Object.keys(other.ans || {}).length){ const nk = k + ":" + other.hid; if (!S.sessions[nk] || (S.sessions[nk].updated || 0) < (other.updated || 0)) S.sessions[nk] = other; }
      continue;
    }
    if ((rv.updated || 0) > (lv.updated || 0)) S.sessions[k] = rv;
  }
  by(S.reviews, R.reviews, v => v.at);
  by(S.rounds, R.rounds, v => v.ts);
  by(S.creads, R.creads, v => v.ts);
  for (const [k, v] of Object.entries(R.histDel || {})) S.histDel[k] = Math.max(S.histDel[k] || 0, v);
  by(S.hist, R.hist || {}, v => v.updated);
  by(S.srs, R.srs || {}, v => v.ts);
  by(S.qtime, R.qtime || {}, v => v.ts); by(S.tags, R.tags || {}, v => v.ts); by(S.devices, R.devices || {}, v => v.ts); by(S.planDay, R.planDay || {}, v => v.ts);
  for (const [k, v] of Object.entries(R.dayQ || {})) S.dayQ[k] = Math.max(S.dayQ[k] || 0, v);
  if (R.plan && (R.plan.ts || 0) > ((S.plan || {}).ts || 0)) S.plan = R.plan;
  ["cdiff","csum","cq2","reports","diary","realExams","myq","mycards","predHist","nbColor"].forEach(k => by(S[k], R[k] || {}, v => v.ts));
  if (R.checklist && (R.checklist.ts || 0) > (S.checklist.ts || 0)) S.checklist = R.checklist;
  for (const [k, v] of Object.entries(R.retry || {})) S.retry[k] = Math.max(S.retry[k] || 0, v);
  for (const [k, v] of Object.entries(R.cview || {})) S.cview[k] = Math.max(S.cview[k] || 0, v);
  for (const [k, v] of Object.entries(R.ctime || {})) S.ctime[k] = Math.max(S.ctime[k] || 0, v);
  for (const [k, v] of Object.entries(R.subjSec || {})) S.subjSec[k] = Math.max(S.subjSec[k] || 0, v);
  ["hourStat","placeStat","dayFirst"].forEach(k => { for (const [kk, v] of Object.entries(R[k] || {})) if (!S[k][kk] || (v.n || 0) > (S[k][kk].n || 0)) S[k][kk] = v; });
  S.snapAt = Math.max(S.snapAt || 0, R.snapAt || 0);
  by(S.memos, R.memos || {}, v => v.ts);
  by(S.why, R.why || {}, v => v.ts);
  by(S.clipSrs, R.clipSrs || {}, v => v.ts);
  by(S.nb, R.nb || {}, v => v.ts);
  for (const [k, v] of Object.entries(R.pageDel || {})) S.pageDel[k] = Math.max(S.pageDel[k] || 0, v);
  for (const [k, v] of Object.entries(R.daySec || {})) S.daySec[k] = Math.max(S.daySec[k] || 0, v);
  for (const [k, v] of Object.entries(R.clipDel || {})) S.clipDel[k] = Math.max(S.clipDel[k] || 0, v);
  for (const [k, t] of Object.entries(S.histDel)) if (S.hist[k] && (S.hist[k].updated || 0) <= t) delete S.hist[k];
  by(S.scrapMap, R.scrapMap, v => v.ts);
  S.scraps = Object.keys(S.scrapMap).filter(k => S.scrapMap[k].on);
  for (const [k, v] of Object.entries(R.noteDel || {})) S.noteDel[k] = Math.max(S.noteDel[k] || 0, v);
  const t = m => m.updated || m.done || m.created || 0;
  (R.mocks || []).forEach(m => { const i = S.mocks.findIndex(x => x.id === m.id); if (i < 0) S.mocks.push(m); else if (t(m) > t(S.mocks[i])) S.mocks[i] = m; });
  S.attend = [...new Set([...(S.attend || []), ...(R.attend || [])])].sort().slice(-400);
  if ((R.examTs || 0) > (S.examTs || 0)){ S.examDate = R.examDate; S.examTs = R.examTs; }
  if ((R.lastTs || 0) > (S.lastTs || 0)){ S.last = R.last; S.lastTs = R.lastTs; }
}
async function mergePages(remote){
  const rB = S.resetAllAt || 0, local = await IDB.all("pages");
  for (const [k, v] of Object.entries(remote || {})){ if ((v.ts || 0) <= rB || (S.pageDel[k] || 0) >= (v.ts || 0)) continue; if (!local[k] || (v.ts || 0) > (local[k].ts || 0)) await IDB.put(k, v, "pages"); }

}

  for (const subj of SUBJ6){

    if (!cids.length || (S.nb[subj] && S.nb[subj].pages.length)) continue;
    const si = SUBJ6.indexOf(subj); let n = 1, pid = `pgm${si}_${n}`, rec = { subj, items: [], strokes: [], ts: 1 }; const pages = { [pid]: rec }, order = [pid]; let y = 50;
    const newPage = () => { n++; pid = `pgm${si}_${n}`; rec = pages[pid] = { subj, items: [], strokes: [], ts: 1 }; order.push(pid); y = 50; };

        const oy = y; b.note.strokes.forEach(s => rec.strokes.push(Object.assign({}, s, { w: s.w * f, pts: s.pts.map(p => [40 + p[0] * f, oy + p[1] * f, p[2]]) }))); y += h + 20; }
      for (const [k, v] of b.clips){ let w = Math.min(920, v.w * (1000 / 1044)), h = v.h * w / v.w; if (h > PH - 140){ w *= (PH - 140) / h; h = PH - 140; } if (y + h > PH - 30) newPage();

const futureDates = () => { const t = todayStr(); return planDates().filter(d => d >= t); };

const dayCap = mins => Math.max(15, Math.round((mins || 60) * .92) - reviewMins());
function unitRemain(d, aOnly){
  const all = dayUnitIds(d, aOnly), left = all.filter(id => !S.qstat[id]);
  const read = all.length && left.length === all.length ? D.concepts.filter(c => c.day === d).length * (aOnly ? 1.5 : 3) : 0;

const p1Queue = aOnly => D.days.filter(x => !S.rounds["day:" + x.day]).map(x => unitRemain(x.day, aOnly)).filter(u => u.ids.length);

function planLayout(){
  const fut = futureDates(), key = fut.join(",") + "|" + (S.plan.mins || 60) + "|" + Object.keys(S.qstat).length + "|" + srsDue().length;
  if (LAYOUT && LAYOUT.key === key) return LAYOUT;
  const T = fut.length, mins = S.plan.mins || 60, cap = dayCap(mins);
  let fin = T >= 30 ? 7 : T >= 20 ? 5 : Math.max(1, Math.round(T * .2)), minP3 = T >= 20 ? 3 : T >= 8 ? 2 : T >= 4 ? 1 : 0, minP2 = T >= 20 ? 2 : T >= 10 ? 1 : 0;

    minP2 = 0; minP3 = Math.min(minP3, T >= 6 ? 1 : 0); fin = Math.max(T >= 4 ? 2 : 1, Math.min(fin, Math.round(T * .15))); maxP1 = Math.max(0, T - fin - minP3 - minP2); }

  const mockKind = mins >= 150 ? "full" : "half", mocks = Math.ceil(p3 / 2);

function phaseOf(date){ if (!S.plan || !S.plan.on) return -1; const L = planLayout(); return L.ph[date] ?? -1; }

// fill one day's P1 work up to the time budget (splits a DAY into parts when the budget is small)
function fillP1(cap, queue, aOnly){

  for (const u of queue){
    if (used >= cap * .9) break;
    const room = cap - used;
    if (u.mins <= room * 1.15){ out.push({ type: "day", day: u.day, aOnly, ids: u.ids.slice(), part: u.ids.length < u.all ? "이어서" : "" }); used += u.mins; u.ids = []; continue; }
    const n = Math.max(5, Math.floor((room - u.read) / 1.5)); if (n <= 0) break;
    const take = u.ids.splice(0, Math.min(n, u.ids.length)); used += u.read + take.length * 1.5; u.read = 0; u.mins = Math.round(u.ids.length * 1.5);

}
function makeTasks(date){

  const budget = P.mins || 60, tasks = [];
  const due = srsDue().length; if (due) tasks.push({ type: "review", n: due });
  if (S.examDate && date === ymd(new Date(dparse(S.examDate).getTime() - 86400000))){ tasks.push({ type: "cards" }, { type: "set", title: "답정너", ids: D.questions.filter(q => q.dap).map(q => q.id) }); return tasks; }
  let cap = L.cap;
  if (ph === 0){
    const queue = p1Queue(L.aOnly);
    if (queue.length && queue[0].day > 1 && cap >= 40){ const cu = cumulIds(queue[0].day, Math.min(10, Math.round(cap / 12))); if (cu.length){ tasks.push({ type: "set", title: "누적 복습", ids: cu }); cap -= cu.length * 1.5; } }

function simulate(nDays, minsOverride){

:"금속관 공사","d":"금속관 안에 전선을 넣는 공사"},{"s":"전기설비기술기준","t":"케이블 트레이 공사","d":"케이블을 트레이 위에 시설하는 공사. 안전율 1.5 이상"},{"s":"전기설비기술기준","t":"대지전압","d":"전선과 대지 사이 전압. 주택 옥내 전로는 300V 이하"},{"s":"전기설비기술기준","t":"누전차단기","d":"누설전류(지락)를 검출해 회로를 자동 차단하는 장치. 욕실 콘센트는 15mA·0.03초 이하"},{"s":"전기설비기술기준","t":"배선차단기","d":"과전류 시 회로를 자동 차단하는 차단기(MCCB)"},{"s":"전기설비기술기준","t":"전기 울타리","d":"가축 등을 위한 울타리 전선. 사용전압 250V 이하, 전선 1.38kN 또는 지름 2mm 이상"},{"s":"전기설비기술기준","t":"전기온상","d":"발열선으로 온상을 가열하는 설비. 발열선 온도 80℃ 이하"},{"s":"전기설비기술기준","t":"분산형 전원","d":"태양광·풍력·연료전지·전기저장장치 등 수요지 근처에 분산 설치한 전원"},{"s":"전기설비기술기준","t":"MPPT","d":"최대 전력점 추종. 태양전지가 최대 전력을 내도록 동작점을 제어"},{"s":"전기설비기술기준","t":"전기저장장치","d":"전기를 저장했다가 공급하는 장치(ESS)"},{"s":"전기설비기술기준","t":"전차선로","d":"전기철도 차량에 전력을 공급하는 선로"},{"s":"전기설비기술기준","t":"이격거리","d":"두 시설물 사이에 확보해야 하는 거리(간격)"},{"s":"전기설비기술기준","t":"TN 계통","d":"전원 측 한 점을 직접 접지하고 기기 노출 도전부를 보호도체로 그 점에 연결하는 계통","a":"TN-"}],"deriv":[{"s":"회로이론","t":"최대 전력 전달 조건","f":"RL = r 일 때 Pmax = E²/(4r)","steps":["부하 전력 P = I²RL = E²RL/(r+RL)²","P를 RL로 미분해 0으로 두면 dP/dRL = E²[(r+RL)² − 2RL(r+RL)]/(r+RL)⁴ = 0","분자 정리: (r+RL) − 2RL = 0 → RL = r","대입: Pmax = E²r/(2r)² = E²/(4r)"],"link":"최대 전력 전달","cid":"c02_15"},{"s":"회로이론","t":"정현파의 실효값","f":"V = Vm/√2","steps":["실효값 정의: 한 주기 동안 v²의 평균의 제곱근 V = √((1/T)∫v²dt)","v = Vm sinωt → v² = Vm² sin²ωt = Vm²(1 − cos2ωt)/2","한 주기 평균에서 cos2ωt 항은 0 → 평균 = Vm²/2","V = √(Vm²/2) = Vm/√2 ≈ 0.707Vm"],"link":"정현파 교류의 크기 표시","cid":"c01_07"},{"s":"회로이론","t":"정현파의 평균값","f":"Vav = 2Vm/π","steps":["반주기 평균 Vav = (1/π)∫₀^π Vm sinθ dθ","∫₀^π sinθ dθ = [−cosθ]₀^π = 2","Vav = 2Vm/π ≈ 0.637Vm"],"link":"정현파 교류의 크기 표시","cid":"c01_07"},{"s":"회로이론","t":"직렬공진 주파수","f":"f0 = 1/(2π√(LC))","steps":["직렬 RLC 임피던스 Z = R + j(ωL − 1/ωC)","공진: 허수부 0 → ωL = 1/(ωC)","ω² = 1/(LC) → ω0 = 1/√(LC)","f0 = ω0/2π = 1/(2π√(LC)). 이때 Z = R(최소), 전류 최대"],"link":"공진","cid":"c01_12"},{"s":"회로이론","t":"3상 전력","f":"P = √3 Vl Il cosθ","steps":["3상 전력 = 한 상 전력의 3배: P = 3 Vp Ip cosθ","Y결선: Vp = Vl/√3, Ip = Il → P = 3(Vl/√3)Il cosθ = √3 Vl Il cosθ","Δ결선: Vp = Vl, Ip = Il/√3 → 같은 결과 √3 Vl Il cosθ","결선과 관계없이 선간전압·선전류로 같은 식"],"link":"3상 전력","cid":"c02_14"},{"s":"회로이론","t":"Y결선 선간전압","f":"Vl = √3 Vp (30° 앞섬)","steps":["선간전압 Vab = Va − Vb (Va = Vp∠0°, Vb = Vp∠−120°)","Va − Vb = Vp[1 − (−1/2 − j√3/2)] = Vp(3/2 + j√3/2)","크기 = Vp√(9/4 + 3/4) = √3 Vp, 각도 = tan⁻¹((√3/2)/(3/2)) = 30°","→ Vab = √3 Vp∠30°"],"link":"Y결선","cid":"c02_22"},{"s":"회로이론","t":"Δ→Y 임피던스 변환","f":"ZY = ZΔ/3 (평형)","steps":["Δ의 두 단자 사이 합성: Zab(Δ) = ZΔ(2ZΔ)/(3ZΔ) = 2ZΔ/3","Y의 같은 두 단자 사이: Zab(Y) = 2ZY","두 값이 같아야 등가 → 2ZY = 2ZΔ/3","ZY = ZΔ/3 (반대로 ZΔ = 3ZY)"],"link":"Δ↔Y 변환","cid":"c02_23"},{"s":"회로이론","t":"V결선 출력","f":"PV = √3 P1 (이용률 86.6%, 출력비 57.7%)","steps":["단상 변압기 1대 용량 P1 = VI","V결선 3상 출력 = √3 V I = √3 P1","이용률 = √3P1/(2P1) = √3/2 ≈ 0.866","출력비(Δ 대비) = √3P1/(3P1) = 1/√3 ≈ 0.577"],"link":"V결선","cid":"c02_25"},{"s":"회로이론","t":"RL 회로 시정수","f":"τ = L/R","steps":["직류 E 인가: E = Ri + L di/dt","해: i(t) = (E/R)(1 − e^(−Rt/L))","t = L/R일 때 i = (E/R)(1 − e⁻¹) ≈ 0.632 × 최종값","그래서 τ = L/R (RC 회로는 같은 방식으로 τ = RC)"],"link":"과도현상","cid":"c04_34"},{"s":"제어공학","t":"피드백 폐루프 전달함수","f":"G/(1 + GH)","steps":["오차 E = R − HC, 출력 C = GE","C = G(R − HC) → C + GHC = GR","C(1 + GH) = GR","C/R = G/(1 + GH)"],"link":"블록선도","cid":"c05_03"},{"s":"제어공학","t":"계단 입력 정상편차","f":"ess = 1/(1 + Kp)","steps":["오차 E(s) = R(s)/(1 + G(s)H(s))","최종값 정리 ess = lim(s→0) sE(s), 계단 R(s) = 1/s","ess = lim(s→0) 1/(1 + G(s)H(s)) = 1/(1 + Kp)","Kp = lim(s→0) G(s)H(s). 1형 이상이면 Kp = ∞ → 편차 0"],"link":"정상편차","cid":"c05_08"},{"s":"제어공학","t":"2차계 고유주파수와 감쇠비","f":"s² + 2ζωn s + ωn² = 0","steps":["표준형 G = ωn²/(s² + 2ζωn s + ωn²)","특성방정식 계수를 비교: 상수항 = ωn², s 계수 = 2ζωn","예: s² + 4s + 16 → ωn = 4, 2ζ(4) = 4 → ζ = 0.5","0 < ζ < 1 부족제동, ζ = 1 임계제동, ζ > 1 과제동"],"link":"2차 제어계","cid":"c05_07"},{"s":"전기자기학","t":"점전하의 전계","f":"E = Q/(4πε0 r²)","steps":["가우스 법칙: 반지름 r 구면을 지나는 전속 = Q","D × 4πr² = Q → D = Q/(4πr²)","E = D/ε0 = Q/(4πε0 r²) = 9×10⁹ Q/r²"],"link":"가우스의 법칙","cid":"c07_05"},{"s":"전기자기학","t":"무한 직선 전하의 전계","f":"E = λ/(2πε0 r)","steps":["반지름 r, 길이 l인 원통면에 가우스 법칙 적용","옆면만 전속 통과: D × 2πrl = λl","D = λ/(2πr) → E = λ/(2πε0 r)","거리에 반비례(점전하는 거리 제곱에 반비례)"],"link":"가우스의 법칙","cid":"c07_05"},{"s":"전기자기학","t":"평행판 콘덴서 정전용량","f":"C = εS/d","steps":["극판 전하 Q, 면적 S → 전속밀도 D = Q/S","E = D/ε = Q/(εS)","전위차 V = Ed = Qd/(εS)","C = Q/V = εS/d"],"link":"정전용량","cid":"c08_07"},{"s":"전기자기학","t":"동심구 콘덴서 정전용량","f":"C = 4πε ab/(b − a)","steps":["내구 a, 외구 b. 사이 전계 E = Q/(4πε r²)","V = ∫a^b E dr = (Q/4πε)(1/a − 1/b)","C = Q/V = 4πε/(1/a − 1/b) = 4πε ab/(b − a)"],"link":"정전용량","cid":"c08_07"},{"s":"전기자기학","t":"정전에너지","f":"W = CV²/2","steps":["전하 q가 쌓인 상태에서 dq를 더 옮기는 일 dW = v dq = (q/C)dq","W = ∫₀^Q (q/C)dq = Q²/(2C)","Q = CV 대입 → W = CV²/2 = QV/2"],"link":"정전에너지","cid":"c08_11"},{"s":"전기자기학","t":"무한 직선 전류의 자계","f":"H = I/(2πr)","steps":["앙페르 주회적분: 반지름 r 원을 따라 ∮H·dl = I","대칭이므로 H × 2πr = I","H = I/(2πr) [A/m]"],"link":"앙페르의 주회적분 법칙","cid":"c09_23"},{"s":"전기자기학","t":"환상 솔레노이드 자계","f":"H = NI/(2πr) (외부 0)","steps":["철심 중심 반지름 r 원에 주회적분: 쇄교 전류 = NI","H × 2πr = NI","H = NI/(2πr). 외부는 쇄교 전류 합이 0 → H = 0"],"link":"솔레노이드","cid":"c09_23"},{"s":"전기자기학","t":"평행 도선 사이 힘","f":"F = 2I1I2/r × 10⁻⁷ [N/m]","steps":["도선1이 거리 r에 만드는 자속밀도 B = μ0I1/(2πr)","도선2(길이 1m)가 받는 힘 F = B I2 = μ0I1I2/(2πr)","μ0 = 4π×10⁻⁷ 대입 → F = 2I1I2/r × 10⁻⁷","같은 방향 전류 흡인, 반대 방향 반발"],"link":"평행 도선","cid":"c09_21"},{"s":"전기자기학","t":"자기 인덕턴스(환상 솔레노이드)","f":"L = μSN²/l","steps":["자계 H = NI/l → 자속 φ = BS = μSNI/l","L = Nφ/I = N(μSNI/l)/I","L = μSN²/l (권수 제곱에 비례)"],"link":"인덕턴스","cid":"c10_32"},{"s":"전기자기학","t":"코일 저장 에너지","f":"W = LI²/2","steps":["전압 v = L di/dt, 전력 p = vi = Li di/dt","W = ∫p dt = ∫₀^I Li di = LI²/2"],"link":"자기 에너지","cid":"c10_31"},{"s":"전기기기","t":"직류기 유기기전력","f":"E = pZφN/(60a)","steps":["도체 1개 기전력 e = Blv, 회전 속도 v = πDN/60","평균 자속밀도 B = pφ/(πDl) → e = pφN/60","직렬 도체 수 = Z/a","E = (Z/a)(pφN/60) = pZφN/(60a) = KφN"],"link":"직류발전기","cid":"c11_03"},{"s":"전기기기","t":"직류전동기 토크","f":"T = pZφIa/(2πa) ≈ 0.975 P/N [kg·m]","steps":["기계 출력 P = E Ia = ωT, ω = 2πN/60","T = E Ia/ω = (pZφN/60a)Ia/(2πN/60) = pZφIa/(2πa)","실용식: T = P/ω = 60P/(2πN) [N·m] = 0.975 P/N [kg·m]"],"link":"직류전동기","cid":"c11_09"},{"s":"전기기기","t":"동기속도","f":"Ns = 120f/p","steps":["회전자계는 1주기마다 2극(한 쌍)만큼 회전","p극이면 1주기에 2/p 회전 → 초당 2f/p 회전","분당 Ns = 60 × 2f/p = 120f/p [rpm]"],"link":"동기속도","cid":"c12_16"},{"s":"전기기기","t":"유도전동기 2차 효율","f":"η2 = 1 − s = N/Ns","steps":["2차 입력 P2 중 2차 동손 Pc2 = sP2","기계 출력 Po = P2 − sP2 = (1 − s)P2","η2 = Po/P2 = 1 − s = N/Ns"],"link":"유도전동기","cid":"c14_43"},{"s":"전기기기","t":"변압기 최대 효율 조건","f":"철손 = 동손","steps":["부하율 m에서 η = mP/(mP + Pi + m²Pc)","분모를 m으로 나누면 P + Pi/m + mPc 가 최소일 때 η 최대","d/dm(Pi/m + mPc) = −Pi/m² + Pc = 0","m²Pc = Pi → 그 부하에서의 동손 = 철손. m = √(Pi/Pc)"],"link":"변압기 효율","cid":"c13_41"},{"s":"전기기기","t":"변압기 전압변동률","f":"ε ≈ p cosθ + q sinθ","steps":["ε = (V20 − V2n)/V2n × 100","근사: 2차 측 전압강하 ≈ I(R cosθ + X sinθ)","%저항강하 p = IR/V × 100, %리액턴스강하 q = IX/V × 100","ε ≈ p cosθ + q sinθ (지상 역률)"],"link":"전압변동률","cid":"c13_35"},{"s":"전기기기","t":"단권변압기 자기용량","f":"자기용량/부하용량 = (Vh − Vl)/Vh","steps":["직렬권선 전압 = Vh − Vl, 전류 = Il(고압측)","자기용량 = (Vh − Vl)Ih","부하용량 = Vh Ih","비 = (Vh − Vl)/Vh"],"link":"단권변압기","cid":"c13_32"},{"s":"전력공학","t":"3상 전압강하","f":"e = √3 I (R cosθ + X sinθ)","steps":["한 상 전압강하 ≈ I(R cosθ + X sinθ) (송·수전단 위상차가 작을 때)","선간전압 기준은 상전압의 √3배","e = √3 I (R cosθ + X sinθ)","P = √3VIcosθ 대입 → e = (P/V)(R + X tanθ)"],"link":"전압강하","cid":"c17_08"},{"s":"전력공학","t":"선로 전력손실과 전압","f":"Pl = P²R/(V² cos²θ)","steps":["3상 손실 Pl = 3I²R","I = P/(√3 V cosθ) 대입","Pl = 3R P²/(3V²cos²θ) = P²R/(V²cos²θ)","같은 전력이면 손실은 전압 제곱·역률 제곱에 반비례"],"link":"전력손실","cid":"c17_08"},{"s":"전력공학","t":"역률 개선 콘덴서 용량","f":"Qc = P(tanθ1 − tanθ2)","steps":["개선 전 무효전력 Q1 = P tanθ1","개선 후 무효전력 Q2 = P tanθ2 (유효전력 P는 그대로)","콘덴서가 공급할 양 Qc = Q1 − Q2 = P(tanθ1 − tanθ2)","tanθ = sinθ/cosθ = √(1 − cos²θ)/cosθ"],"link":"역률 개선","cid":"c18_19"},{"s":"전력공학","t":"%임피던스와 단락전류","f":"Is = (100/%Z) In","steps":["%Z = (In Z/E) × 100 → Z = %Z·E/(100 In)","단락전류 Is = E/Z = E × 100In/(%Z·E)","Is = (100/%Z) In","단락용량 Ps = (100/%Z) Pn"],"link":"%Z법(%임피던스법)","cid":"c18_23"},{"s":"전력공학","t":"전선의 이도와 실제 길이","f":"D = WS²/(8T), L = S + 8D²/(3S)","steps":["포물선 근사: 경간 S, 수평장력 T, 단위 하중 W","중앙 처짐 D = WS²/(8T)","실제 길이 L ≈ S + 8D²/(3S)","이도는 경간 제곱에 비례, 장력에 반비례"],"link":"이도","cid":"c16_07"},{"s":"전력공학","t":"충전전류","f":"Ic = ωC (V/√3)","steps":["한 상 대지 정전용량 C에 걸리는 전압은 상전압 E = V/√3","Ic = E/Xc = ωCE","Ic = 2πfC V/√3 [A]","충전용량 Qc = 3ωCE² = ωCV²"],"link":"충전전류","cid":"c17_16"},{"s":"전력공학","t":"단상 2선식 대비 3상 3선식 전선량","f":"3상 3선식 전선량 = 75%","steps":["같은 전력·전압·손실, 단상 2선식 저항 R1, 3상 저항 R3","손실 같음: 2(P/V)²R1 = 3(P/√3V)²R3 → R3 = 2R1","전선 단면적은 저항에 반비례 → 3상 1가닥 = 단상 1가닥의 1/2","총량 비 = (3 × 1/2)/(2 × 1) = 3/4 = 75%"],"link":"배전방식","cid":"c19_38"},{"s":"전력공학","t":"수용률·부등률·부하율로 변압기 용량","f":"Tr = Σ(설비 × 수용률)/(부등률 × 역률)","steps":["각 수용가 최대전력 = 설비용량 × 수용률","합성 최대전력 = Σ최대전력/부등률","kVA 환산: ÷ 역률","Tr ≥ Σ(설비 × 수용률)/(부등률 × cosθ)"],"link":"부하의 계산","cid":"c19_41"}],"kec":[{"c":"총칙","t":"전압 구분","d":"저압: 교류 1kV 이하·직류 1.5kV 이하 / 고압: 교류 1kV 초과~7kV 이하·직류 1.5kV 초과~7kV 이하 / 특고압: 7kV 초과","cid":"c20_01"},{"c":"총칙","t":"제2차 접근상태","d":"가공전선이 다른 시설물 위쪽·옆쪽에서 수평거리 3m 미만에 있는 상태","cid":"c20_01"},{"c":"전선","t":"전선 접속","d":"접속 시 전선의 세기를 20% 이상 감소시키지 않을 것","cid":"c20_02"},{"c":"전선","t":"병렬 사용 전선 굵기","d":"구리 50mm² 이상, 알루미늄 70mm² 이상","cid":"c20_02"},{"c":"절연","t":"저압 절연저항 대체","d":"절연저항 측정이 곤란하면 누설전류 1mA 이하로 관리","cid":"c20_04"},{"c":"절연","t":"절연내력 시험","d":"시험전압을 전로와 대지 사이에 연속 10분간. 직류로 하면 교류 시험전압의 2배","cid":"c20_04"},{"c":"절연","t":"절연내력 시험전압 배수","d":"최대사용전압 7kV 이하 1.5배(최저 500V) / 7kV 초과 비접지 1.25배(최저 10,500V) / 중성선 다중접지 0.92배 / 170kV 이하 중성점 직접접지 0.72배 / 170kV 초과 직접접지 0.64배","cid":"c20_04"},{"c":"접지","t":"보호도체 단면적","d":"선도체 16mm² 이하 → 선도체와 같게 / 16~35mm² → 16mm² / 35mm² 초과 → 선도체의 1/2","cid":"c20_05"},{"c":"접지","t":"중성점 접지용 접지도체","d":"기본 16mm² 이상. 7kV 이하 전로 등 예외 6mm² 이상","cid":"c20_05"},{"c":"가공전선","t":"가공전선 높이 (35kV 이하)","d":"도로 횡단 6m, 철도 횡단 레일면 6.5m, 횡단보도교 위 저압 3.5m(절연전선 3m)","ci     const lab = g === "ALL" ? "전체" : g === "AB" ? "A+B" : g + "등급";
    newSession("self", ids, `${sj} ${lab} ${ids.length}문제`); location.hash = "#/quiz/self"; return; }
  const gd = e.target.closest("[data-gday]");
  if (gd){ e.stopPropagation(); const d = +gd.dataset.gday, ids = (byDay[d] || []).filter(id => Q[id].grade === "A");
    newSession("grade:" + d, ids, `DAY ${pad(d)} · A등급 ${ids.length}문제`); location.hash = "#/quiz/grade:" + d; return; }
  const hx = e.target.closest("[data-hidekey],[data-redo],[data-rscrap],[data-ssubj],[data-scrapsolve],[data-unscrap],[data-hdel]");
  if (hx){ const d = hx.dataset; e.stopPropagation();
    if (d.hidekey){ if (d.hidekey.startsWith("exam:")){ const m = mockById(d.hidekey.slice(5)); if (m){ m.hidden = true; m.updated = Date.now(); } } else quitSession(d.hidekey); save(); keepScroll(); return; }
    if (d.redo){ redo(d.redo, d.wrong === "1"); return; }
    if (d.rscrap){ const on = toggleScrap(d.rscrap); hx.classList.toggle("on", on); hx.innerHTML = `${I.star}${on ? "스크랩됨" : "스크랩"}`; return; }
    if (d.ssubj){ S.prefs.scrapSubj = d.ssubj; save(true); keepScroll(); return; }
    if (d.scrapsolve){ const ids = scrapIds(d.scrapsolve); if (!ids.length) return; newSession("scrap", ids, `${d.scrapsolve === "all" ? "전체" : d.scrapsolve} ${ids.length}문제`); location.hash = "#/quiz/scrap"; return; }
    if (d.unscrap){ toggleScrap(d.unscrap); keepScroll(); return; }
  }
  const cq = !e.target.closest(".modal") && e.target.closest("[data-cq]");
  if (cq){ startConceptQuiz(cq.dataset.cq); return; }
  const t = e.target.closest("[data-go],[data-act],[data-pick],[data-tab],[data-nav],[data-jump],[data-concept],[data-tool],[data-size],[data-pcol],[data-ink],[data-note],[data-scrapq]");
  if (!t) return;
  const d = t.dataset;
  if (d.go !== undefined){ if (d.go) location.hash = d.go; return; }
  if (d.concept){ openConcept(d.concept); return; }
  if (d.pick){ answer(+d.pick); return; }
  if (d.tab){ setTab(d.tab, true); return; }
  if (d.nav){ go(+d.nav); return; }
  if (d.jump !== undefined){ jumpTo(+d.jump); return; }
  if (d.tool){ Ink.eraseMode = d.tool === "eraser"; Ink.tb(); return; }
  if (d.pcol){ S.prefs.color = d.pcol; Ink.eraseMode = false; save(true); Ink.tb(); return; }
  if (d.size !== undefined){ S.prefs.size = +d.size; Ink.eraseMode = false; save(true); Ink.tb(); return; }
  if (d.ink){ Ink.cmd(d.ink); if (NB.host && document.body.contains(NB.host)) NB.refreshTb(); return; }
  if (d.note){ openNote(d.note); return; }
  if (d.scrapq){ const f = S.prefs.scrapSubj || "all", ids = scrapIds(f); newSession("scrap", ids, `${f === "all" ? "전체" : f} ${ids.length}문제`); S.sessions.scrap.pos = Math.max(0, ids.indexOf(d.scrapq)); save(); location.hash = "#/quiz/scrap"; return; }
  const a = d.act;
  if (a === "dap" || a === "rand") startSpecial(a);
  else if (a === "scrapgo") startSpecial("scrap");
  else if (a === "reveal") reveal();
  else if (a === "result") finishSet();
  else if (a === "submit") submitMock(false);
  else if (a === "mockstart") createMockGated();
  else if (a === "randmock") location.hash = "#/mock";
  else if (a === "selfstart") startSelf();
  else if (a === "scrap"){ const on = toggleScrap(curQ().id); QZ.exam ? renderExamLeft() : renderLeft(); toast(on ? "스크랩했어요" : "스크랩을 해제했어요"); }
  else if (a === "export") doExport();
  else if (a === "import"){ const f = $("#impf"); f.onchange = () => f.files[0] && doImport(f.files[0]); f.click(); }
  else if (a === "resetall"){ if (await ask(`풀이 기록을 초기화할까요?<br><small>풀이·정답률·오늘의 복습·학습 기록·모의고사·DAY 회차·공부한 날이 지워져요.${Sync.linked() ? "<br>구글 드라이브와 다른 기기에도 똑같이 적용돼요." : ""}</small>`, "초기화", "취소")) doReset(false); }
  else if (a === "resetevery"){ if (await ask(`<b>전체 초기화</b>할까요?<br><small>풀이 기록에 더해 스크랩·필기·공식 노트·메모·회독 체크까지 모두 지워져요. 되돌릴 수 없어요.${Sync.linked() ? "<br>구글 드라이브와 다른 기기에도 적용돼요." : ""}</small>`, "모두 지우기", "취소")) doReset(true); }
  else if (a === "otacheck") OTA.check(true);
  else if (a === "tagq"){ const q = curQ(); if (q) tagDialog(q.id); }
  else if (a === "calc") calcOpen();
  else if (a === "report"){ const q = curQ(); if (q) reportDialog(q.id); }
  else if (a === "flag") toggleFlag();
  else if (a === "chall"){ CH_ALL = !CH_ALL; const el = $(".chlog"); if (el) el.innerHTML = changelogHTML(); }
  else if (a === "snapnow"){ toast("드라이브 백업본을 만드는 중…"); try { await Sync.snapshot(null, true); toast("드라이브 백업본을 만들었어요"); fillSnaps(); } catch(e){ toast("만들지 못했어요: " + String(e).slice(0, 40)); } }
  else if (a === "testnoti"){ if (window.Android && Android.testNotify){ sumT = 0; pushSummary(); Android.testNotify(); } }
  else if (a === "review") startReview();
  else if (a === "final"){ const ids = finalIds(); if (!ids.length){ toast("남은 문제가 없어요"); } else { newSession("final", ids, `시험 직전 세트 ${ids.length}문제`); location.hash = "#/quiz/final"; } }
  else if (a === "clip") startClip();
  else if (a === "guess"){ QZ.guess = !QZ.guess; const b = $("#guessb"); if (b) b.classList.toggle("on", QZ.guess); }
  else if (a === "__never"){}
  else if (a === "scrapgrad"){ S.prefs.scrapGrad = S.prefs.scrapGrad === false; save(true); keepScroll(); }
  else if (a === "otareset"){ if (await ask("받은 업데이트를 지우고 설치된 기본 화면으로 되돌릴까요?<br>기록과 필기는 그대로예요.")){ Android.otaClear(); Android.reload(); } }
  else if (a === "doprint"){ if (window.Android && Android.printPage) Android.printPage("전기기사 개념 노트"); else window.print(); }
  else if (a === "synclogin") Sync.connect();
  else if (a === "syncnow") Sync.run(true).then(() => keepScroll());
  else if (a === "syncoff"){ if (await ask("드라이브 동기화 연결을 해제할까요?<br>이 기기의 기록은 그대로 남아요.")){ Sync.disconnect(); keepScroll(); } }
});
document.addEventListener("keydown", e => {
  if (document.querySelector(".modal") || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "")) return;
  if (CP){ const bs = document.querySelectorAll(".cbar [data-go]"); if (e.key === "ArrowLeft" && bs[0] && bs[0].dataset.go) location.hash = bs[0].dataset.go; if (e.key === "ArrowRight" && bs[1] && bs[1].dataset.go) location.hash = bs[1].dataset.go; return; }
  if (!QZ) return;
  if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); if (["1","2","3","4"].includes(e.key)) answer(+e.key);
});
document.addEventListener("keydown", e => {
  const m = document.querySelector(".modal[data-cid]"); if (!m) return;
  const dir = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0; if (!dir) return;
  const b = m.querySelectorAll("[data-cmove]")[dir > 0 ? 1 : 0]; if (b && !b.disabled) b.click();
});
window.addEventListener("resize", () => { if ((QZ && QZ.tab === "canvas") || CP) Ink.resize(); });
MQ.addEventListener("change", () => { if (QZ){ if (!isMob() && QZ.tab === "q") QZ.tab = "canvas"; if (isMob() && QZ.tab === "canvas") QZ.tab = (!QZ.exam && sess(QZ.set.key).ans[curQ().id]) ? "ans" : "q"; renderQuiz(); } else if (CP) cpTab(isMob() ? "q" : "canvas"); else keepScroll();
  setTimeout(() => { if (typeof NB !== "undefined" && NB.host && document.body.contains(NB.host)) NB.resize(); }, 120); });
window.addEventListener("hashchange", () => {
  const h = location.hash;
  if (!NAVOK && S.prefs.lockExit && isStudyHash(LASTHASH) && !isStudyHash(h) && document.querySelector(".qwrap:not(.nbpage-view)")){
    history.replaceState(null, "", LASTHASH); lockToast(); return;   // stay on the study screen
  }
  LASTHASH = h; Ink.flush(); NB.flushAll(); route(); });
document.addEventListener("visibilitychange", () => { if (document.hidden){ Ink.flush(); persist(); Sync.run(); } });
window.addEventListener("pagehide", () => persist());
setInterval(() => { if (!document.hidden) Sync.run(); }, 20 * 1000);
let syncDeb; const _save = save; save = function(quiet){ _save(quiet); if (!quiet && Sync.linked()){ clearTimeout(syncDeb); syncDeb = setTimeout(() => Sync.run(), 10 * 1000); } };
/* 나가기 잠금: 문제 풀이·모의고사·개념 공부 화면에서 홈·뒤로가기 막기 */
const isStudyHash = h => /^#\/(quiz|exam|concept|flip)(\/|$)/.test(h || "");
let LASTHASH = location.hash, NAVOK = false;
function navOK(){ NAVOK = true; setTimeout(() => NAVOK = false, 2000); }
const lockOn = () => !!S.prefs.lockExit && isStudyHash(LASTHASH) && !!document.querySelector(".qwrap:not(.nbpage-view)");
function lockToast(){ toast("나가기 잠금 중이에요 · 위쪽 🔒을 누르면 풀려요"); if (navigator.vibrate) navigator.vibrate(40); }
const lockBtn = () => `<button class="lockb ${S.prefs.lockExit ? "on" : ""}" data-lockexit title="나가기 잠금 (홈·뒤로가기 막기)">${S.prefs.lockExit ? "🔒" : "🔓"}</button>`;
/* 기기 홈·최근 앱 버튼까지 막기: 안드로이드 '앱 고정' (APK) */
let PINNED = false, PINTRIED = false;
function syncPin(){
  if (!(window.Android && Android.pinApp)) return;
  try { if (PINNED && Android.pinState && Android.pinState() === 0){ PINNED = false; PINTRIED = true; } } catch(e){}   // user unpinned it
  const want = !!S.prefs.lockExit && isStudyHash(location.hash);
  if (want && !PINNED && !PINTRIED){ PINNED = true; PINTRIED = true; Android.pinApp(true); setTimeout(checkPin, 3000); }
  if (!S.prefs.lockExit && PINNED){ PINNED = false; Android.pinApp(false); }
}
function checkPin(){ try { if (S.prefs.lockExit && Android.pinState && Android.pinState() === 0){ PINNED = false; pinHelp(); } } catch(e){} }
function pinHelp(){
  if (document.querySelector(".pinhelp")) return;
  const m = document.createElement("div"); m.className = "modal pinhelp";
  m.innerHTML = `<div class="sheet" style="max-width:520px;height:auto"><div class="hd"><h3>기기 홈 버튼까지 막으려면</h3><button class="x" data-close>${I.x}</button></div><div class="bd">
    <p class="cdesc" style="margin-top:0">앱 안의 홈·뒤로가기는 지금도 막혀 있어요. 기기 자체의 홈·최근 앱 버튼은 안드로이드 <b>앱 고정</b>을 켜야 막을 수 있어요.</p>
    <ol class="flist"><li>기기 <b>설정 → 보안 및 개인정보 보호 → 기타 보안 설정 → 앱 고정</b>을 켜세요<br><small class="cdesc">(기종에 따라 설정 → 생체 인식 및 보안 → 기타 보안 설정)</small></li>
      <li>앱으로 돌아와 🔒을 껐다가 다시 켜면, 고정 확인 창이 떠요 → <b>확인</b></li>
      <li>풀 때는 🔒을 끄거나, <b>뒤로가기와 최근 앱 버튼을 함께 길게</b> 누르세요 (제스처 모드는 아래에서 위로 쓸어올려 유지)</li></ol>
    <div class="acts" style="margin-top:12px"><button class="btn y" data-close>알겠어요</button></div></div></div>`;
  m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) m.remove(); });
  document.body.appendChild(m);
}
function toggleLock(){ S.prefs.lockExit = !S.prefs.lockExit; save(true); PINTRIED = false; syncPin();
  document.querySelectorAll("[data-lockexit]").forEach(b => { b.classList.toggle("on", S.prefs.lockExit); b.textContent = S.prefs.lockExit ? "🔒" : "🔓"; });
  toast(S.prefs.lockExit ? (window.Android && Android.pinApp ? "나가기 잠금 켜짐 · 고정 확인 창이 뜨면 '확인'을 눌러주세요" : "나가기 잠금 켜짐 · 홈·뒤로가기가 막혀요") : "나가기 잠금 꺼짐"); }
window.__androidBack = () => {
  const m = document.querySelector(".modal"); if (m){ m.remove(); return true; }
  if (lockOn()){ lockToast(); return true; }
  if (CP){ location.hash = "#/concepts/" + C[CP.cid].day; return true; }
  if (location.hash.startsWith("#/nb/")){ location.hash = "#/notes"; return true; }
  if (QZ && QZ.exam){ location.hash = "#/mock"; return true; }
  if (location.hash && location.hash !== "#/" && location.hash !== "#"){ location.hash = "#/"; return true; }
  return false;
};

(async function(){
  await IDB.open();
  await loadState();
  D = window.__DATA__ || await (await fetch("data.json")).json();
  D.questions.forEach(q => { Q[q.id] = q; (byDay[q.day] = byDay[q.day] || []).push(q.id); });
  D.concepts.forEach(c => C[c.id] = c);
  computeGrades();
  try { await migrateNotebooks(); await cleanOldConceptNotes(); } catch(e){ console.warn("nb migrate", e); }
  compactHist();
  try { await loadMyQ(); } catch(e){}
  if (S.prefs.pin) showLock();
  setInterval(() => { if (["time","auto"].includes(S.prefs.theme)) applyTheme(); }, 300000);
  applyTheme(); window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  // CBT rounds (optional file: cbt/cbt.json — comes with an APK update or an online update)
  D.cbt = D.cbt || []; D.cbtQuestions = [];
  try {
    const r = window.__DATA__ ? null : await fetch("cbt/cbt.json", { cache:"no-store" });
    if (r && r.ok){ const cb = await r.json(); const titles = {};
      (cb.rounds || []).forEach(x => titles[x.id] = x.title); D.cbt = cb.rounds || [];
      (cb.questions || []).forEach(q => { q.cbt = true; q.roundTitle = titles[q.round] || q.round; Q[q.id] = q; D.cbtQuestions.push(q); }); }
  } catch(e){}
  if (!S.migr3){ Object.entries(S.qstat).forEach(([id, st]) => { if (Q[id] && (st.last === "X" || st.last === "T") && !S.srs[id]) S.srs[id] = { step:0, due: todayStr(), ts: Date.now() }; }); S.migr3 = true; save(true); }
  if (!S.migr2){ Object.entries(S.qstat).forEach(([id, st]) => { if (Q[id] && (st.last === "X" || st.last === "T")) autoScrap(id, st.last); }); S.migr2 = true; save(true); }

  route();
  if (window.Android && Android.bootOk) Android.bootOk();
  autoBackup();
  setTimeout(() => Sync.run(), 1200);
  setTimeout(() => OTA.check(false), 2500);
  focusTick(); setTimeout(() => { autoFileBackup(); setExtraAlarms(); }, 4000);
  try { if (window.Android && Android.takeAction){ const a = Android.takeAction(); if (a) window.__action(a); } } catch(e){}
  setTimeout(() => { if (!location.hash || location.hash === "#/") maybeWeekly(); pushSummary(); }, 1500);
})();
